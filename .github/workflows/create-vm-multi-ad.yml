name: Try to Create OCI VM (Multi-AD)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-free-arm-instance-multi-ad
  cancel-in-progress: false

env:
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  SUPPRESS_LABEL_WARNING: "True"
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}

jobs:
  try-create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Cache OCI CLI
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

      - name: Reuse retained boot volumes and create A1 instances across ADs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          oci_fast() {
            oci --no-retry --connection-timeout 5 --read-timeout 20 "$@"
          }

          disable_workflow() {
            gh workflow disable create-vm-multi-ad.yml --repo "$GITHUB_REPOSITORY" || true
          }

          queue_next_run() {
            echo "Queueing the next retry run instead of waiting for GitHub's delayed schedule."
            gh workflow run create-vm-multi-ad.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true
          }

          # ADs to try in order; missing secrets skip the AD.
          AD_KEYS=(PHX1 PHX2 PHX3 IAD1 SJC1 FRA1 LHR1 NRT1 SYD1 YUL1 YYZ1)
          # Each AD must have these secrets defined (or the AD is skipped):
          #   OCI_<KEY>_AD_NAME        e.g. "PHX-AD-1"
          #   OCI_<KEY>_SUBNET_ID      subnet OCID in that AD
          #   OCI_<KEY>_BOOT_VOLUME_ID retained boot volume OCID in that AD
          #   OCI_<KEY>_INSTANCE_NAME  display name in that AD (default oci-free-arm-vm-<key>)

          try_one_ad() {
            local ad_key="$1"
            local ad_name subnet_id boot_id instance_name

            ad_name=$(gh secret get "OCI_${ad_key}_AD_NAME" --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
            subnet_id=$(gh secret get "OCI_${ad_key}_SUBNET_ID" --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
            boot_id=$(gh secret get "OCI_${ad_key}_BOOT_VOLUME_ID" --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
            instance_name=$(gh secret get "OCI_${ad_key}_INSTANCE_NAME" --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "oci-free-arm-vm-${ad_key,,}")

            if [ -z "$ad_name" ] || [ -z "$subnet_id" ] || [ -z "$boot_id" ]; then
              echo "[skip] $ad_key: missing AD_NAME/SUBNET_ID/BOOT_VOLUME_ID secrets"
              return 1
            fi
            echo "[try ] $ad_key -> $ad_name (instance=$instance_name)"

            # Check for already-existing instance with that name
            EXISTING=$(oci_fast compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "$instance_name" \
              --all \
              --query 'data[?"lifecycle-state"!=`TERMINATED`].{id:id,state:"lifecycle-state"} | [0]' 2>&1) || true
            EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty' 2>/dev/null || echo "")
            if [ -n "$EXISTING_ID" ]; then
              EXISTING_STATE=$(echo "$EXISTING" | jq -r '.state' 2>/dev/null || echo "")
              echo "  -> $ad_key: already exists $EXISTING_ID ($EXISTING_STATE)"
              if [ "$EXISTING_STATE" = "RUNNING" ] || [ "$EXISTING_STATE" = "STOPPED" ]; then
                echo "Instance already RUNNING/STOPPED; disabling workflow."
                disable_workflow
                exit 0
              fi
              return 0
            fi

            # Confirm boot volume state/AD/size
            BOOT_INFO=$(oci_fast bv boot-volume get \
              --boot-volume-id "$boot_id" \
              --query 'data.{state:"lifecycle-state",ad:"availability-domain",sizeGB:"size-in-gbs"}' 2>&1) || true
            BOOT_STATE=$(echo "$BOOT_INFO" | jq -r '.state' 2>/dev/null || echo "")
            BOOT_AD=$(echo "$BOOT_INFO" | jq -r '.ad' 2>/dev/null || echo "")
            BOOT_SIZE=$(echo "$BOOT_INFO" | jq -r '.sizeGB' 2>/dev/null || echo "")
            if [ "$BOOT_STATE" != "AVAILABLE" ] || [ "$BOOT_AD" != "$ad_name" ] || [ "$BOOT_SIZE" != "100" ]; then
              echo "  -> $ad_key: boot volume bad (state=$BOOT_STATE ad=$BOOT_AD size=$BOOT_SIZE)"
              return 1
            fi

            # Try to launch
            OCI_OUTPUT=$(oci_fast compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$ad_name" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$subnet_id" \
              --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"${boot_id}\"}" \
              --assign-public-ip true \
              --display-name "$instance_name" \
              --freeform-tags '{"free-tier-recovery":"retained-boot-volume","ad-pool":"multi-ad"}' \
              --query 'data.{id:id,state:"lifecycle-state",shape:shape,ocpus:"shape-config".ocpus,memoryGB:"shape-config"."memory-in-gbs"}' \
              2>&1) || true
            echo "$OCI_OUTPUT" | head -3

            if grep -Eqi 'Out of host capacity|OUT_OF_CAPACITY' <<<"$OCI_OUTPUT"; then
              echo "  -> $ad_key: out of capacity"
              return 1
            fi
            if grep -Eqi 'InvalidParameter|Unauthorized|Forbidden|NotFound' <<<"$OCI_OUTPUT"; then
              echo "  -> $ad_key: permanent error, skipping rest of run for this AD"
              return 2
            fi

            INSTANCE_ID=$(echo "$OCI_OUTPUT" | jq -r '.id // empty' 2>/dev/null || echo "")
            if [ -z "$INSTANCE_ID" ]; then
              echo "  -> $ad_key: no instance ID returned"
              return 1
            fi
            echo "  -> $ad_key: instance creation accepted: $INSTANCE_ID"

            if oci compute instance get \
              --instance-id "$INSTANCE_ID" \
              --wait-for-state RUNNING \
              --max-wait-seconds 900 \
              >/tmp/instance-running.json; then
              cat /tmp/instance-running.json
              echo "  -> $ad_key: instance is RUNNING. Disabling future retries."
              disable_workflow
              exit 0
            fi
            return 1
          }

          END_TIME=$((SECONDS + 60 * 60))
          ATTEMPT=0

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "== Pool attempt $ATTEMPT =="

            # Try each AD in order; if any succeeds, the script exits 0.
            SKIPPED=0
            for key in "${AD_KEYS[@]}"; do
              rc=0
              try_one_ad "$key" || rc=$?
              if [ "$rc" -eq 0 ]; then exit 0; fi
              if [ "$rc" -eq 2 ]; then SKIPPED=$((SKIPPED+1)); fi
            done

            # If every AD was skipped, no point re-running
            if [ "$SKIPPED" -ge "${#AD_KEYS[@]}" ]; then
              echo "All ADs skipped (missing secrets). Disabling workflow."
              disable_workflow
              exit 0
            fi

            sleep $((15 + RANDOM % 16))
          done

          echo "All ADs remained out of capacity after $ATTEMPT attempts in this one-hour run."
          queue_next_run
          exit 1