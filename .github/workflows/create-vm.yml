name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-free-arm-instance
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  SUPPRESS_LABEL_WARNING: "True"
  INSTANCE_NAME: oci-free-arm-vm
  SHAPE: VM.Standard.A1.Flex
  REQUEST_OCPUS: "1"
  REQUEST_MEMORY_GB: "6"
  REQUEST_BOOT_GB: "50"
  REQUEST_VPUS_PER_GB: "10"

jobs:
  try-create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Cache OCI CLI
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub
          chmod 600 /tmp/ssh_key.pub

      - name: Create an Always Free A1 instance across Phoenix ADs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          oci_fast() {
            oci --no-retry --connection-timeout 5 --read-timeout 20 "$@"
          }

          oci_list() {
            local output
            if ! output=$(oci_fast "$@"); then
              return 1
            fi
            if [ -z "${output//[[:space:]]/}" ]; then
              printf '%s\n' '{"data":[]}'
              return 0
            fi
            if ! jq -e 'type == "object" and (.data | type == "array")' <<<"$output" >/dev/null; then
              echo "OCI list returned invalid JSON; refusing to continue." >&2
              return 1
            fi
            printf '%s\n' "$output"
          }

          disable_workflow() {
            gh workflow disable create-vm.yml --repo "$GITHUB_REPOSITORY" || true
          }

          queue_next_run() {
            echo "Queueing the next retry run instead of relying only on GitHub's delayed schedule."
            gh workflow run create-vm.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              || echo "Immediate dispatch failed; the five-minute schedule remains the fallback."
          }

          existing_instance() {
            local output instance count
            if ! output=$(oci_list compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "$INSTANCE_NAME" \
              --all); then
              echo "Could not safely check for an existing instance." >&2
              return 2
            fi

            count=$(jq '[.data[] | select(.["lifecycle-state"] != "TERMINATED")] | length' <<<"$output")
            if [ "$count" -gt 1 ]; then
              echo "Multiple non-terminated target instances exist; disabling retries for manual inspection." >&2
              disable_workflow
              return 2
            fi

            instance=$(jq -c '[.data[] | select(.["lifecycle-state"] != "TERMINATED")] | first // empty' <<<"$output")
            if [ -z "$instance" ]; then
              return 1
            fi
            printf '%s\n' "$instance"
          }

          handle_existing_instance() {
            local instance id state status
            if instance=$(existing_instance); then
              :
            else
              status=$?
              if [ "$status" -eq 2 ]; then
                return 2
              fi
              return 1
            fi

            id=$(jq -r '.id // empty' <<<"$instance")
            state=$(jq -r '.["lifecycle-state"] // empty' <<<"$instance")
            if [ -z "$id" ] || [ -z "$state" ]; then
              echo "Existing instance data is incomplete; refusing another launch." >&2
              return 2
            fi

            printf '%s' "$id" >/tmp/existing-instance-id
            echo "A non-terminated instance already exists (state=$state)."
            case "$state" in
              RUNNING|STOPPED)
                echo "Target instance is ready; disabling future retries."
                disable_workflow
                ;;
              *)
                echo "Target instance is still transitioning; queueing a later recheck without launching a duplicate."
                queue_next_run
                ;;
            esac
            return 0
          }

          reconcile_ambiguous_launch() {
            local check status consecutive_absent=0

            echo "The launch result may be ambiguous; checking for an accepted instance for 60 seconds."
            for check in $(seq 1 12); do
              sleep 5
              if handle_existing_instance; then
                return 0
              else
                status=$?
                if [ "$status" -eq 1 ]; then
                  consecutive_absent=$((consecutive_absent + 1))
                else
                  consecutive_absent=0
                  echo "Duplicate check $check/12 failed while reconciling the launch result."
                fi
              fi
            done

            if [ "$consecutive_absent" -ge 3 ]; then
              echo "No instance appeared during the ambiguity window."
              return 1
            fi

            echo "Could not obtain enough consecutive duplicate checks to classify the launch result safely."
            return 2
          }

          if [ "$OCI_CLI_REGION" != "us-phoenix-1" ]; then
            echo "Refusing to create compute outside the Always Free home region us-phoenix-1."
            exit 1
          fi

          for value in "$COMPARTMENT_ID" "$IMAGE_ID" "$SUBNET_ID" "$OCI_CLI_TENANCY"; do
            if [ -z "$value" ]; then
              echo "A required OCI identifier is missing."
              exit 1
            fi
          done
          if [ ! -s /tmp/ssh_key.pub ]; then
            echo "The SSH public key is missing."
            exit 1
          fi

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT

          if handle_existing_instance; then
            exit 0
          else
            EXISTING_STATUS=$?
            if [ "$EXISTING_STATUS" -eq 2 ]; then
              echo "Cannot continue without a successful duplicate check."
              exit 1
            fi
          fi

          SUBNET_INFO=$(oci_fast network subnet get --subnet-id "$SUBNET_ID")
          SUBNET_AD=$(jq -r '.data["availability-domain"] // empty' <<<"$SUBNET_INFO")
          SUBNET_STATE=$(jq -r '.data["lifecycle-state"] // empty' <<<"$SUBNET_INFO")
          if [ -n "$SUBNET_AD" ] || [ "$SUBNET_STATE" != "AVAILABLE" ]; then
            echo "The configured subnet is not an AVAILABLE regional subnet; refusing cross-AD launches."
            exit 1
          fi
          echo "Regional subnet gate passed."

          IMAGE_INFO=$(oci_fast compute image get --image-id "$IMAGE_ID")
          IMAGE_STATE=$(jq -r '.data["lifecycle-state"] // empty' <<<"$IMAGE_INFO")
          IMAGE_OS=$(jq -r '.data["operating-system"] // empty' <<<"$IMAGE_INFO")
          if [ "$IMAGE_STATE" != "AVAILABLE" ] || [ -z "$IMAGE_OS" ]; then
            echo "The configured platform image is not AVAILABLE; refusing to launch."
            exit 1
          fi
          echo "Image gate passed (OS=$IMAGE_OS)."

          oci_list iam availability-domain list \
            --compartment-id "$OCI_CLI_TENANCY" \
            >"$WORK_DIR/ads.json"
          mapfile -t ADS < <(jq -r '.data[].name' "$WORK_DIR/ads.json" | sort)
          if [ "${#ADS[@]}" -ne 3 ]; then
            echo "Expected exactly three Phoenix availability domains; refusing unexpected placement."
            exit 1
          fi
          for AD in "${ADS[@]}"; do
            case "$AD" in
              *:PHX-AD-1|*:PHX-AD-2|*:PHX-AD-3) ;;
              *) echo "Unexpected availability domain; refusing to continue."; exit 1 ;;
            esac
          done

          : >"$WORK_DIR/boot-volumes.ndjson"
          : >"$WORK_DIR/block-volumes.ndjson"
          for AD in "${ADS[@]}"; do
            oci_list bv boot-volume list \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --all \
              | jq -c '.data[] | select(.["lifecycle-state"] != "TERMINATED" and .["lifecycle-state"] != "TERMINATING") | {sizeGB: .["size-in-gbs"]}' \
              >>"$WORK_DIR/boot-volumes.ndjson"
            oci_list bv volume list \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --all \
              | jq -c '.data[] | select(.["lifecycle-state"] != "TERMINATED" and .["lifecycle-state"] != "TERMINATING") | {sizeGB: .["size-in-gbs"]}' \
              >>"$WORK_DIR/block-volumes.ndjson"
          done
          CURRENT_BOOT_GB=$(jq -sc '[.[].sizeGB // 0] | add // 0' "$WORK_DIR/boot-volumes.ndjson")
          CURRENT_BLOCK_GB=$(jq -sc '[.[].sizeGB // 0] | add // 0' "$WORK_DIR/block-volumes.ndjson")
          PROJECTED_STORAGE_GB=$((CURRENT_BOOT_GB + CURRENT_BLOCK_GB + REQUEST_BOOT_GB))
          echo "Projected boot + block storage after launch: ${PROJECTED_STORAGE_GB} GB."
          if [ "$PROJECTED_STORAGE_GB" -gt 150 ]; then
            echo "Launch would exceed the target envelope of one retained 100 GB disk plus one 50 GB instance disk."
            exit 1
          fi

          oci_list compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --all \
            >"$WORK_DIR/instances.json"
          CURRENT_A1_OCPUS=$(jq '[.data[] | select(.["lifecycle-state"] != "TERMINATED" and .shape == "VM.Standard.A1.Flex") | .["shape-config"].ocpus // 0] | add // 0' "$WORK_DIR/instances.json")
          CURRENT_A1_MEMORY=$(jq '[.data[] | select(.["lifecycle-state"] != "TERMINATED" and .shape == "VM.Standard.A1.Flex") | .["shape-config"]["memory-in-gbs"] // 0] | add // 0' "$WORK_DIR/instances.json")
          if ! jq -ne --argjson ocpus "$CURRENT_A1_OCPUS" --argjson memory "$CURRENT_A1_MEMORY" \
            '($ocpus == 0) and ($memory == 0)' >/dev/null; then
            echo "Existing A1 usage already consumes the single-instance target envelope; refusing another launch."
            exit 1
          fi
          echo "A1 compute gate passed for one 1 OCPU/6 GB target instance."

          for AD in "${ADS[@]}"; do
            SHAPES=$(oci_list compute shape list \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --image-id "$IMAGE_ID" \
              --all)
            if ! jq -e --arg shape "$SHAPE" '.data[] | select(.shape == $shape)' <<<"$SHAPES" >/dev/null; then
              echo "The configured image is not compatible with $SHAPE in $AD."
              exit 1
            fi
          done
          echo "Image/shape compatibility gate passed for all Phoenix ADs."

          END_TIME=$((SECONDS + 55 * 60))
          ATTEMPT=0
          while [ "$SECONDS" -lt "$END_TIME" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            for AD in "${ADS[@]}"; do
              if handle_existing_instance; then
                exit 0
              else
                EXISTING_STATUS=$?
                if [ "$EXISTING_STATUS" -eq 2 ]; then
                  echo "Duplicate check failed; waiting before the next pool attempt."
                  sleep $((15 + RANDOM % 16))
                  continue 2
                fi
              fi

              echo "Capacity attempt $ATTEMPT in ${AD##*:}."
              set +e
              OCI_OUTPUT=$(oci_fast compute instance launch \
                --compartment-id "$COMPARTMENT_ID" \
                --availability-domain "$AD" \
                --shape "$SHAPE" \
                --shape-config "{\"ocpus\":${REQUEST_OCPUS},\"memoryInGBs\":${REQUEST_MEMORY_GB}}" \
                --subnet-id "$SUBNET_ID" \
                --source-details "{\"sourceType\":\"image\",\"imageId\":\"${IMAGE_ID}\",\"bootVolumeSizeInGBs\":${REQUEST_BOOT_GB},\"bootVolumeVpusPerGB\":${REQUEST_VPUS_PER_GB}}" \
                --ssh-authorized-keys-file /tmp/ssh_key.pub \
                --assign-public-ip true \
                --display-name "$INSTANCE_NAME" \
                --freeform-tags '{"always-free":"phoenix-multi-ad"}' \
                --query 'data.{id:id,state:"lifecycle-state"}' \
                2>&1)
              EXIT_CODE=$?
              set -e

              if [ "$EXIT_CODE" -ne 0 ]; then
                if grep -Eqi 'Out of host capacity|OUT_OF_CAPACITY' <<<"$OCI_OUTPUT"; then
                  echo "Capacity unavailable in ${AD##*:}."
                  continue
                fi
                if grep -Eqi 'TooManyRequests|Too many requests|429' <<<"$OCI_OUTPUT"; then
                  echo "OCI rate-limited the request in ${AD##*:}; waiting before continuing."
                  sleep $((15 + RANDOM % 16))
                  continue
                fi
                if grep -Eqi 'timed out|timeout|InternalError|InternalServerError|BadGateway|ServiceUnavailable|GatewayTimeout|status[" ]*:?[[:space:]]*5[0-9][0-9]' <<<"$OCI_OUTPUT"; then
                  echo "OCI returned a potentially ambiguous service or network error in ${AD##*:}."
                  if reconcile_ambiguous_launch; then
                    exit 0
                  fi
                  RECONCILE_STATUS=$?
                  if [ "$RECONCILE_STATUS" -eq 2 ]; then
                    echo "The duplicate checks were inconclusive; stopping rather than risking another instance."
                  else
                    echo "No accepted instance was found; ending this run before trying another AD."
                  fi
                  queue_next_run
                  exit 1
                fi
                echo "$OCI_OUTPUT" | sed -E 's/ocid1\.[[:alnum:]._-]+/<redacted-ocid>/g' >&2
                echo "OCI returned a non-retryable launch error; stopping."
                exit 1
              fi

              INSTANCE_ID=$(jq -r '.id // empty' <<<"$OCI_OUTPUT")
              if [ -z "$INSTANCE_ID" ]; then
                echo "Launch returned success without an instance ID; reconciling by name before stopping."
                if reconcile_ambiguous_launch; then
                  exit 0
                fi
                echo "Could not safely identify an accepted instance."
                queue_next_run
                exit 1
              fi
              echo "Instance creation accepted in ${AD##*:}."

              if oci compute instance get \
                --instance-id "$INSTANCE_ID" \
                --wait-for-state RUNNING \
                --max-wait-seconds 900 \
                >"$WORK_DIR/instance-running.json"; then
                STATE=$(jq -r '.data["lifecycle-state"]' "$WORK_DIR/instance-running.json")
                echo "Instance reached $STATE; disabling future retries."
                disable_workflow
                exit 0
              fi

              echo "Instance was accepted and will be rechecked by the next run."
              queue_next_run
              exit 1
            done
            sleep $((15 + RANDOM % 16))
          done

          echo "Phoenix capacity remained unavailable after $ATTEMPT pool attempts."
          queue_next_run
          exit 1
