name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-free-arm-instance
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  SUPPRESS_LABEL_WARNING: "True"
  AD_NAME: QNKM:PHX-AD-3
  INSTANCE_NAME: oci-free-arm-vm

jobs:
  try-create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Cache OCI CLI
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

      - name: Reuse retained boot volume and create A1 instance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          oci_fast() {
            oci --no-retry --connection-timeout 5 --read-timeout 20 "$@"
          }

          disable_workflow() {
            gh workflow disable create-vm.yml --repo "$GITHUB_REPOSITORY" || true
          }

          queue_next_run() {
            local next_run_at

            next_run_at=$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)
            echo "Queueing the next retry run for $next_run_at instead of waiting for GitHub's delayed schedule."
            nohup bash -c '
              sleep 300
              gh workflow run create-vm.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            ' >/tmp/queue-next-run.log 2>&1 &
          }

          find_existing_instance() {
            local output

            if ! output=$(oci_fast compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --query 'data[?"lifecycle-state"!=`TERMINATED`].{id:id,state:"lifecycle-state"} | [0]' \
              2>&1); then
              echo "$output" >&2
              return 1
            fi

            printf '%s' "$output"
          }

          handle_existing_instance() {
            local existing_info existing_id existing_state

            if ! existing_info=$(find_existing_instance); then
              echo "Could not check for an existing instance; skipping this launch cycle."
              return 2
            fi

            existing_id=$(jq -r '.id // empty' <<<"$existing_info")
            if [ -z "$existing_id" ]; then
              return 1
            fi

            existing_state=$(jq -r '.state' <<<"$existing_info")
            echo "Instance already exists: $existing_id ($existing_state)."
            if [ "$existing_state" = "RUNNING" ] || [ "$existing_state" = "STOPPED" ]; then
              disable_workflow
            fi
            return 0
          }

          if handle_existing_instance; then
            exit 0
          else
            EXISTING_STATUS=$?
            if [ "$EXISTING_STATUS" -eq 2 ]; then
              echo "Cannot safely launch without a successful duplicate check."
              exit 1
            fi
          fi

          BOOT_INFO=$(oci_fast bv boot-volume get \
            --boot-volume-id "$BOOT_VOLUME_ID" \
            --query 'data.{state:"lifecycle-state",ad:"availability-domain",sizeGB:"size-in-gbs"}')
          echo "Retained boot volume: $BOOT_INFO"

          BOOT_STATE=$(echo "$BOOT_INFO" | jq -r '.state')
          BOOT_AD=$(echo "$BOOT_INFO" | jq -r '.ad')
          BOOT_SIZE=$(echo "$BOOT_INFO" | jq -r '.sizeGB')

          if [ "$BOOT_STATE" != "AVAILABLE" ] || [ "$BOOT_AD" != "$AD_NAME" ] || [ "$BOOT_SIZE" != "100" ]; then
            echo "Boot volume must be AVAILABLE, 100 GB, and in $AD_NAME."
            exit 1
          fi

          END_TIME=$((SECONDS + 60 * 60))
          ATTEMPT=0

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Capacity attempt $ATTEMPT in $AD_NAME"

            if handle_existing_instance; then
              exit 0
            else
              EXISTING_STATUS=$?
              if [ "$EXISTING_STATUS" -eq 2 ]; then
                sleep $((10 + RANDOM % 11))
                continue
              fi
            fi

            set +e
            OCI_OUTPUT=$(oci_fast compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"${BOOT_VOLUME_ID}\"}" \
              --assign-public-ip true \
              --display-name "$INSTANCE_NAME" \
              --freeform-tags '{"free-tier-recovery":"retained-boot-volume"}' \
              --query 'data.{id:id,state:"lifecycle-state",shape:shape,ocpus:"shape-config".ocpus,memoryGB:"shape-config"."memory-in-gbs"}' \
              2>&1)
            EXIT_CODE=$?
            set -e

            echo "$OCI_OUTPUT"
            if [ "$EXIT_CODE" -ne 0 ]; then
              if grep -Eqi 'Out of host capacity|OUT_OF_CAPACITY' <<<"$OCI_OUTPUT"; then
                echo "Capacity unavailable on attempt $ATTEMPT."
              elif grep -Eqi 'timed out|timeout|TooManyRequests|429|InternalServerError|BadGateway|ServiceUnavailable|GatewayTimeout|status[" ]*:?[[:space:]]*5[0-9][0-9]' <<<"$OCI_OUTPUT"; then
                echo "OCI returned a temporary service or network error on attempt $ATTEMPT."
              else
                echo "OCI returned a non-retryable error; stopping."
                exit 1
              fi

              sleep $((15 + RANDOM % 16))
              continue
            fi

            INSTANCE_ID=$(jq -r '.id // empty' <<<"$OCI_OUTPUT")
            if [ -z "$INSTANCE_ID" ]; then
              echo "OCI returned success without an instance ID; stopping."
              exit 1
            fi
            echo "Instance creation accepted: $INSTANCE_ID"

            if oci compute instance get \
              --instance-id "$INSTANCE_ID" \
              --wait-for-state RUNNING \
              --max-wait-seconds 900 \
              >/tmp/instance-running.json; then
              cat /tmp/instance-running.json
              echo "Instance is RUNNING. Disabling future retries."
              disable_workflow
              exit 0
            fi

            echo "Instance was accepted but is not RUNNING yet. A later run will recheck it without creating a duplicate."
            exit 1
          done

          echo "Capacity remained unavailable after $ATTEMPT attempts in this one-hour run."
          queue_next_run
          exit 1
