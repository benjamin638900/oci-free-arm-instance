name: Probe OCI A1 Capacity

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cache OCI CLI
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

      - name: Generate ephemeral A1 capacity reports
        run: |
          set -euo pipefail

          oci_fast() {
            oci --no-retry --connection-timeout 5 --read-timeout 30 "$@"
          }

          SHAPE_REQUEST='[{"instanceShape":"VM.Standard.A1.Flex","instanceShapeConfig":{"ocpus":2,"memoryInGBs":12}}]'

          for AD in QNKM:PHX-AD-1 QNKM:PHX-AD-2 QNKM:PHX-AD-3; do
            echo "=== $AD ==="
            if oci_fast compute compute-capacity-report create \
              --compartment-id "$OCI_CLI_TENANCY" \
              --availability-domain "$AD" \
              --shape-availabilities "$SHAPE_REQUEST" \
              > /tmp/capacity-report.json 2>/tmp/capacity-report.err; then
              jq -c '{
                availabilityDomain: .data["availability-domain"],
                shapeAvailabilities: [.data["shape-availabilities"][] | {
                  faultDomain: .["fault-domain"],
                  instanceShape: .["instance-shape"],
                  instanceShapeConfig: .["instance-shape-config"],
                  availableCount: .["available-count"],
                  availabilityStatus: .["availability-status"]
                }]
              }' /tmp/capacity-report.json
            else
              sed -E 's/ocid1\.[[:alnum:]._-]+/<redacted-ocid>/g' /tmp/capacity-report.err
            fi
          done
