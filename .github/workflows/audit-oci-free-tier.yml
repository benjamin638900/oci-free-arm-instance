name: Audit OCI Always Free Resources

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cache OCI CLI
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

      - name: Read-only audit of A1 limits, storage, and backups
        run: |
          set -euo pipefail

          oci_read() {
            oci --no-retry --connection-timeout 5 --read-timeout 30 "$@"
          }

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT

          oci_read iam availability-domain list \
            --compartment-id "$OCI_CLI_TENANCY" \
            >"$WORK_DIR/ads.json"
          mapfile -t ADS < <(jq -r '.data[].name' "$WORK_DIR/ads.json")

          echo "=== Availability domains ==="
          printf '%s\n' "${ADS[@]}"

          echo "=== A1 service limits ==="
          for LIMIT_NAME in standard-a1-core-count standard-a1-memory-count; do
            oci_read limits value list \
              --compartment-id "$COMPARTMENT_ID" \
              --service-name compute \
              --name "$LIMIT_NAME" \
              --all \
              >"$WORK_DIR/${LIMIT_NAME}-values.json"

            jq -c --arg limit "$LIMIT_NAME" '{
              limit: $limit,
              values: [.data[] | {
                scopeType: .["scope-type"],
                availabilityDomain: .["availability-domain"],
                value: .value
              }]
            }' "$WORK_DIR/${LIMIT_NAME}-values.json"

            for AD in "${ADS[@]}"; do
              if oci_read limits resource-availability get \
                --compartment-id "$COMPARTMENT_ID" \
                --service-name compute \
                --limit-name "$LIMIT_NAME" \
                --availability-domain "$AD" \
                >"$WORK_DIR/resource-availability.json" 2>"$WORK_DIR/resource-availability.err"; then
                jq -c --arg limit "$LIMIT_NAME" --arg ad "$AD" '{
                  limit: $limit,
                  availabilityDomain: $ad,
                  available: .data.available,
                  used: .data.used,
                  fractionalAvailability: .data["fractional-availability"]
                }' "$WORK_DIR/resource-availability.json"
              else
                echo "{\"limit\":\"$LIMIT_NAME\",\"availabilityDomain\":\"$AD\",\"resourceAvailability\":\"not reported by API\"}"
              fi
            done
          done

          oci_read iam compartment list \
            --compartment-id "$OCI_CLI_TENANCY" \
            --compartment-id-in-subtree true \
            --access-level ACCESSIBLE \
            --all \
            >"$WORK_DIR/compartments.json"
          mapfile -t COMPARTMENTS < <(
            {
              printf '%s\n' "$OCI_CLI_TENANCY"
              jq -r '.data[] | select(.["lifecycle-state"] == "ACTIVE") | .id' "$WORK_DIR/compartments.json"
            } | sort -u
          )
          echo "Accessible compartments audited: ${#COMPARTMENTS[@]}"

          : >"$WORK_DIR/boot-volumes.ndjson"
          : >"$WORK_DIR/block-volumes.ndjson"
          : >"$WORK_DIR/boot-backups.ndjson"
          : >"$WORK_DIR/block-backups.ndjson"
          : >"$WORK_DIR/instances.ndjson"

          for COMPARTMENT in "${COMPARTMENTS[@]}"; do
            for AD in "${ADS[@]}"; do
              oci_read bv boot-volume list \
                --compartment-id "$COMPARTMENT" \
                --availability-domain "$AD" \
                --all \
                | jq -c '.data[] | {
                    availabilityDomain: .["availability-domain"],
                    sizeGB: .["size-in-gbs"],
                    state: .["lifecycle-state"],
                    alwaysFreeRetained: (
                      .["system-tags"]["orcl-cloud"]["free-tier-retained"] == "true" or
                      .["system-tags"]["orcl-cloud"]["free-tier-retained"] == true
                    )
                  }' >>"$WORK_DIR/boot-volumes.ndjson"

              oci_read bv volume list \
                --compartment-id "$COMPARTMENT" \
                --availability-domain "$AD" \
                --all \
                | jq -c '.data[] | {
                    availabilityDomain: .["availability-domain"],
                    sizeGB: .["size-in-gbs"],
                    state: .["lifecycle-state"]
                  }' >>"$WORK_DIR/block-volumes.ndjson"
            done

            oci_read bv boot-volume-backup list \
              --compartment-id "$COMPARTMENT" \
              --all \
              | jq -c '.data[] | {
                  state: .["lifecycle-state"],
                  type: .type,
                  sizeGB: .["size-in-gbs"]
                }' >>"$WORK_DIR/boot-backups.ndjson"

            oci_read bv backup list \
              --compartment-id "$COMPARTMENT" \
              --all \
              | jq -c '.data[] | {
                  state: .["lifecycle-state"],
                  type: .type,
                  sizeGB: .["size-in-gbs"]
                }' >>"$WORK_DIR/block-backups.ndjson"

            oci_read compute instance list \
              --compartment-id "$COMPARTMENT" \
              --all \
              | jq -c '.data[] | select(.["lifecycle-state"] != "TERMINATED") | {
                  availabilityDomain: .["availability-domain"],
                  shape: .shape,
                  state: .["lifecycle-state"],
                  ocpus: .["shape-config"].ocpus,
                  memoryGB: .["shape-config"]["memory-in-gbs"]
                }' >>"$WORK_DIR/instances.ndjson"
          done

          echo "=== Storage summary ==="
          jq -sc '{
            bootVolumeCount: length,
            bootVolumeGB: ([.[].sizeGB // 0] | add // 0),
            alwaysFreeRetainedBootVolumeCount: ([.[] | select(.alwaysFreeRetained)] | length),
            byAvailabilityDomain: (group_by(.availabilityDomain) | map({
              availabilityDomain: .[0].availabilityDomain,
              count: length,
              totalGB: ([.[].sizeGB // 0] | add // 0)
            }))
          }' "$WORK_DIR/boot-volumes.ndjson"

          jq -sc '{
            blockVolumeCount: length,
            blockVolumeGB: ([.[].sizeGB // 0] | add // 0)
          }' "$WORK_DIR/block-volumes.ndjson"

          echo "=== Backup summary ==="
          jq -sc '{bootVolumeBackupCount: length, availableCount: ([.[] | select(.state == "AVAILABLE")] | length)}' \
            "$WORK_DIR/boot-backups.ndjson"
          jq -sc '{blockVolumeBackupCount: length, availableCount: ([.[] | select(.state == "AVAILABLE")] | length)}' \
            "$WORK_DIR/block-backups.ndjson"

          echo "=== Non-terminated compute summary ==="
          jq -sc '{count: length, instances: .}' "$WORK_DIR/instances.ndjson"
